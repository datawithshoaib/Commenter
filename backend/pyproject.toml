[project]
name = "commenter-backend"
version = "0.1.0"
description = "Commenter API: AI comment generation for LinkedIn and X with LangChain, LangGraph and Groq"
authors = [
    { name = "Shoaib Akthar", email = "shoaibakthar.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
